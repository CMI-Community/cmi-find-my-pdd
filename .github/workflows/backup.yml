name: Encrypted daily backup
on:
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: vars.ENABLE_ENCRYPTED_BACKUP == 'true'
    runs-on: ubuntu-latest
    container: postgres:17
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      APP_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ops:backup
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: backups/*.cmibak
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
