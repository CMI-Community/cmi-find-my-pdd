name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Real PostgreSQL transaction and encrypted restore verification
        env:
          PDD_PG_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/verify-postgres.mjs
